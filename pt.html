<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실사 렌더 — GOFIT 짐 스튜디오</title>
<!-- the photoreal render (path tracing, like Blender's Cycles): the 3D view's scene comes in by postMessage as a GLB; three.js
     0.187 + three-gpu-pathtracer (WebGL) from jsDelivr, pinned versions, on its own page so they do not meet the app's three r147 -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.18/build/index.module.js",
  "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.28/build/index.module.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f11; color: #e8ebee; font: 13px/1.4 "Pretendard", "Noto Sans KR", system-ui, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #c:active { cursor: grabbing; }
  .top { position: fixed; left: 14px; right: 14px; top: 12px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
  .top b { font-size: 15px; } .top small { color: #aab3bb; }
  .top .sp { flex: 1; }
  .bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    padding: 8px 10px; border-radius: 12px; background: rgba(20, 23, 27, .86); box-shadow: 0 6px 24px rgba(0, 0, 0, .4); backdrop-filter: blur(6px); max-width: calc(100% - 28px); }
  .bar button { appearance: none; border: 1px solid #3a4148; background: #23282d; color: #e8ebee; border-radius: 8px; padding: 6px 11px; font: inherit; cursor: pointer; white-space: nowrap; }
  .bar button:hover { background: #2c3238; } .bar button.pri { background: #2450e0; border-color: #2450e0; } .bar button.pri:hover { background: #3560ee; }
  .bar label { display: inline-flex; align-items: center; gap: 6px; color: #c6cdd3; white-space: nowrap; }
  .bar select { background: #23282d; color: #e8ebee; border: 1px solid #3a4148; border-radius: 7px; padding: 4px 6px; font: inherit; }
  .bar input[type=range] { width: 110px; accent-color: #2450e0; }
  .sep { width: 1px; align-self: stretch; background: #3a4148; }
  #st { min-width: 160px; color: #cfd6dc; font-variant-numeric: tabular-nums; }
  #prog { position: fixed; left: 0; top: 0; height: 3px; background: #2450e0; width: 0; transition: width .3s; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: rgba(13, 15, 17, .82); }
  .msg[hidden] { display: none; }
  .msg div { max-width: 460px; } .msg b { display: block; font-size: 16px; margin-bottom: 6px; } .msg p { color: #aab3bb; margin: 6px 0 0; }
  .spin { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid #3a4148; border-top-color: #2450e0; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="prog"></div>
<div class="top"><b>실사 렌더</b><small>블렌더 Cycles처럼 빛을 실제로 계산해요 · 처음엔 거칠다가 시간이 지날수록 깨끗해져요 · 끌면 돌리기 · 오른쪽 끌기 옮기기 · 휠 확대</small><span class="sp"></span></div>
<div class="bar">
  <span id="st">준비 중…</span><span class="sep"></span>
  <label>목표 <select id="goal"><option value="100">빠르게 (100)</option><option value="300" selected>보통 (300)</option><option value="1000">고품질 (1000)</option><option value="0">계속</option></select></label>
  <label>속도 <select id="load" title="그래픽카드를 얼마나 쓸지 — 빠르게는 그동안 컴퓨터가 버벅일 수 있어요"><option value=".8" selected>빠르게</option><option value=".45">보통</option><option value=".2">조용히</option></select></label>
  <label>해상도 <select id="res"><option value="auto" selected>자동 (빠름)</option><option value="1">선명하게 (원본)</option><option value="0.5">절반</option></select></label>
  <label title="샘플이 적을 때 거친 점을 부드럽게 지워요"><input type="checkbox" id="dn" checked> 노이즈 제거</label>
  <label>밝기 <input type="range" id="exp" min="-2" max="2" step="0.1" value="0"></label>
  <label>조명 세기 <input type="range" id="lit" min="0" max="3" step="0.1" value="1"></label>
  <span class="sep"></span>
  <button id="pause">일시정지</button><button id="save" class="pri">이미지 저장</button><button id="close">닫기</button>
</div>
<div class="msg" id="msg"><div><div class="spin"></div><b id="msgT">렌더러 불러오는 중…</b><p id="msgP">처음 한 번은 인터넷에서 렌더러를 받아요(약 2MB).</p></div></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { WebGLPathTracer, GradientEquirectTexture, DenoiseMaterial } from 'three-gpu-pathtracer';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

const $ = s => document.querySelector(s), cv = $('#c'), DEG = Math.PI / 180;
const msg = (t, p, spin = true) => { $('#msg').hidden = !t; if (!t) return; $('#msgT').textContent = t; $('#msgP').textContent = p || ''; $('.spin').style.display = spin ? '' : 'none'; };
const post = (o) => parent.postMessage(o, location.origin);
let renderer, pt, scene, camera, controls, running = false, goal = 300, lights = [], emits = [], D = null, GPU = '', spf = 1, RES = 'auto', DENOISE = true, dnq = null;
/* how much of the screen is computed: 'auto' keeps it near 0.9 million pixels (1280 × 720) — the time a sample takes goes with the pixel count (measured: half the size, four times the speed; bounces and the number of lights hardly matter) */
const autoScale = () => { const dpr = renderer.getPixelRatio(), px = innerWidth * innerHeight * dpr * dpr; return RES === 'auto' ? Math.min(1, Math.sqrt(.9e6 / px)) : +RES; };

try {
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5)); renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1;      // AgX: Blender's own view transform
  scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .05, 600);
  controls = new OrbitControls(camera, cv); controls.enableDamping = false; controls.screenSpacePanning = true;
  pt = new WebGLPathTracer(renderer); pt.tiles.set(1, 1); pt.bounces = 5; pt.transmissiveBounces = 6; pt.filterGlossyFactor = .5; pt.minSamples = 2; pt.fadeDuration = 250; pt.renderScale = 1; pt.dynamicLowRes = true; pt.lowResScale = .25;
  pt.renderScale = autoScale();
  /* the picture shown with a light denoise while there are few samples (edge-keeping: textures stay, the speckle goes) */
  dnq = new FullScreenQuad(new DenoiseMaterial({ map: null, blending: THREE.NoBlending, premultipliedAlpha: renderer.getContextAttributes().premultipliedAlpha }));
  pt.renderToCanvasCallback = (target, r, quad) => {
    const ac = r.autoClear; r.autoClear = false; const s = pt.samples;
    if (DENOISE && s < 1500) { const m = dnq.material; m.uniforms.map.value = target.texture; m.uniforms.opacity.value = quad.material.opacity; m.blending = quad.material.blending; m.uniforms.sigma.value = Math.max(1.2, 4.5 - Math.log2(1 + s) * .45); m.uniforms.threshold.value = .035; m.uniforms.kSigma.value = 1; dnq.render(r); }
    else quad.render(r);
    r.autoClear = ac;
  };
  controls.addEventListener('change', () => { pt.updateCamera(); spf = 1; });      // moving: one sample a frame so it follows the mouse, then it speeds up again
  { const g = renderer.getContext(), x = g.getExtension('WEBGL_debug_renderer_info'); GPU = x ? String(g.getParameter(x.UNMASKED_RENDERER_WEBGL)).replace(/^ANGLE \((.*)\)$/, '$1').split(',').slice(1, 2).join('').replace(/\(0x[0-9a-f]+\)/i, '').replace(/\s+(Direct3D|OpenGL|Vulkan|Metal).*$/i, '').trim() || g.getParameter(x.UNMASKED_RENDERER_WEBGL) : ''; }
  msg('장면을 기다리는 중…', '3D 화면의 장면을 받아요.');
  post({ type: 'pt-ready' });
} catch (err) { msg('이 기기에서는 실사 렌더를 할 수 없어요', String(err && err.message || err), false); }

window.addEventListener('resize', () => { if (!renderer) return; if (pt) pt.renderScale = autoScale(); renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); pt.updateCamera(); });
window.addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.type !== 'scene') return; start(e.data).catch(err => { console.error(err); msg('장면을 그리지 못했어요', String(err && err.message || err), false); }); });

/* the app's materials → what the path tracer understands (standard / physical only): glass is real glass, the fixtures' glow
   lights up, the unlit ceiling is lit; every face both sides (single-sided planes let the sky in) */
function fixMat(m) {
  const n = m.name || '';
  if (n.includes('PT_GLASS')) { const g = new THREE.MeshPhysicalMaterial({ color: m.color.clone().lerp(new THREE.Color(1, 1, 1), .55), roughness: n.includes('frost') ? .35 : .02, metalness: 0, transmission: 1, ior: 1.5, thickness: .012, side: THREE.DoubleSide }); g.name = n; return g; }
  if (n.includes('PT_EMIT')) { const e = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: new THREE.Color(D.glow), emissiveIntensity: 4 * D.lum, side: THREE.DoubleSide }); e.name = n; emits.push(e); return e; }
  if (m.isMeshBasicMaterial) { const s = new THREE.MeshStandardMaterial({ color: m.color, map: m.map || null, roughness: .9, metalness: 0, side: THREE.DoubleSide }); s.name = n; return s; }
  if (m.isMeshStandardMaterial) { m.side = THREE.DoubleSide; if (m.transparent && m.opacity < .999) { m.transparent = false; m.opacity = 1; } m.envMapIntensity = 1; return m; }
  return new THREE.MeshStandardMaterial({ color: m.color || 0xcccccc, map: m.map || null, roughness: .8, side: THREE.DoubleSide });
}
/* the sky as the path tracer wants it: float data, linear (a JPG or a canvas gradient → sRGB decoded; a little extra for daylight,
   since an 8-bit photo tops out at white where a real sky is brighter) */
function toData(src, w, h, gain) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.drawImage(src, 0, 0, w, h);
  const px = x.getImageData(0, 0, w, h).data, f = new Float32Array(w * h * 4), lin = v => v <= .04045 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
  for (let i = 0; i < px.length; i += 4) { f[i] = lin(px[i] / 255) * gain; f[i + 1] = lin(px[i + 1] / 255) * gain; f[i + 2] = lin(px[i + 2] / 255) * gain; f[i + 3] = 1; }
  const t = new THREE.DataTexture(f, w, h, THREE.RGBAFormat, THREE.FloatType); t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.LinearSRGBColorSpace; t.flipY = true; t.minFilter = t.magFilter = THREE.LinearFilter; t.needsUpdate = true; return t;
}
function skyTexture(s) {
  if (s.kind === 'pano') return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(toData(im, 2048, 1024, 1.6)); im.onerror = () => rej(new Error('배경 사진을 못 불러왔어요')); im.src = s.url; });
  if (s.kind === 'grad') { const c = document.createElement('canvas'); c.width = 16; c.height = 512; const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 512); s.g.forEach(([o, col]) => g.addColorStop(o, col)); x.fillStyle = g; x.fillRect(0, 0, 16, 512); return Promise.resolve(toData(c, 256, 128, 1.4)); }
  const t = new GradientEquirectTexture(); t.topColor.set('#f4f6f8'); t.bottomColor.set('#8a9096'); t.update(); return Promise.resolve(t);
}
function setLights() {
  const k = +$('#lit').value; for (const l of lights) l.intensity = l.userData.base * k; for (const e of emits) e.emissiveIntensity = 4 * D.lum * Math.max(.15, k);
  pt.updateLights(); pt.updateMaterials();
}
async function start(d) {
  D = d; msg('장면 불러오는 중…', `${(d.glb.byteLength / 1048576).toFixed(1)} MB`);
  const gltf = await new GLTFLoader().parseAsync(d.glb, ''); const root = gltf.scene;
  root.traverse(o => { if (!o.isMesh) return; o.material = Array.isArray(o.material) ? o.material.map(fixMat) : fixMat(o.material); o.castShadow = o.receiveShadow = true; });
  scene.add(root);
  const sky = await skyTexture(d.sky); scene.environment = sky; scene.background = sky; const r = -(d.sky.rot || 0) * DEG; if (scene.environmentRotation) { scene.environmentRotation.y = r; scene.backgroundRotation.y = r; }
  if (d.sun && d.sun.intensity > 0) { const s = new THREE.DirectionalLight(d.sun.color, d.sun.intensity * 3.2); s.position.fromArray(d.sun.dir).multiplyScalar(100); s.userData.base = s.intensity; scene.add(s, s.target); }
  // the ceiling lights as area lights where they glow (the path tracer samples them directly: far less noise than glowing faces alone)
  const L = d.lights || [], n = L.length, keep = n > 24 ? 24 : n, step = n / Math.max(1, keep), share = n / Math.max(1, keep);
  for (let i = 0; i < keep; i++) {
    const q = L[Math.floor(i * step)], holder = new THREE.Object3D(); holder.position.set(q.x, q.y, q.z); holder.rotation.y = q.rot || 0;
    const a = new THREE.RectAreaLight(new THREE.Color(d.glow), 9 * d.lum * share, Math.max(.12, q.w), Math.max(.12, q.d)); a.lookAt(0, -1, 0); a.userData.base = a.intensity; holder.add(a); scene.add(holder); lights.push(a);
  }
  scene.updateMatrixWorld(true);
  camera.fov = d.cam.fov || 40; camera.position.fromArray(d.cam.pos); controls.target.fromArray(d.cam.target); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); controls.update();
  msg('빛 계산 준비 중…', '처음 한 번은 몇 초 걸려요.');
  await new Promise(r => setTimeout(r, 30));
  pt.setScene(scene, camera); setLights(); msg(''); running = true;
}
/* as many samples a frame as the graphics card can actually finish. A fence after each frame's work says when the card is done
   (gl.finish does not wait under Windows' ANGLE: work piled up by the hundred, the render crawled and the computer stayed slow
   until the pile was through): no new work while the last is unfinished, more when it finished within a frame. 보통 / 조용히 rest
   the card for as long again / four times as long as it worked, for the rest of the computer. */
let last = -1, prevT = performance.now(), dtAvg = 16, rate = 0, rs = 0, rt = performance.now(), LOAD = .8, fence = null, slow = 0, tSub = 0, restUntil = 0;
function loop() {
  requestAnimationFrame(loop); const now = performance.now(), dt = now - prevT; prevT = now; dtAvg = dtAvg * .9 + Math.min(250, dt) * .1; if (!running || !pt) return;
  const gl = renderer.getContext();
  if (fence) {
    if (gl.getSyncParameter(fence, gl.SYNC_STATUS) !== gl.SIGNALED) { if (++slow >= 3 && spf > 1) { spf = Math.max(1, Math.floor(spf / 1.5)); slow = 0; } return; }      // the card is still on it
    gl.deleteSync(fence); fence = null; const work = now - tSub; restUntil = now + work * (1 - LOAD) / LOAD; if (slow === 0 && spf < 128) spf = Math.min(128, spf + Math.max(1, Math.round(spf * .3))); slow = 0;
  }
  if (now < restUntil) return;      // 보통 / 조용히: the card rests in proportion to the time it worked
  let n = 0; for (; n < spf && (!goal || pt.samples < goal); n++) pt.renderSample();
  if (n) { fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0); gl.flush(); tSub = now; }
  const s = Math.floor(pt.samples); if (now - rt > 700) { rate = Math.max(0, (pt.samples - rs) / ((now - rt) / 1000)); rs = pt.samples; rt = now; }
  if (s !== last) { last = s; const done = goal && s >= goal; const cvw = renderer.domElement.width * pt.renderScale, cvh = renderer.domElement.height * pt.renderScale; $('#st').textContent = (done ? `완성 · ${s} 샘플` : `${s}${goal ? ' / ' + goal : ''} 샘플 · 초당 ${rate < 10 ? rate.toFixed(1) : Math.round(rate)}`) + ` · ${Math.round(cvw)}×${Math.round(cvh)}` + (GPU ? ` · ${GPU}` : ''); $('#prog').style.width = goal ? Math.min(100, s / goal * 100) + '%' : '0'; }
}
loop();
window.PT = { get pt() { return pt; }, get scene() { return scene; }, get camera() { return camera; }, get renderer() { return renderer; } };      // (checks)
$('#goal').onchange = e => { goal = +e.target.value; last = -1; };
$('#res').onchange = e => { RES = e.target.value; pt.renderScale = autoScale(); pt.reset(); };
$('#dn').onchange = e => { DENOISE = e.target.checked; pt.reset(); };
$('#exp').oninput = e => { renderer.toneMappingExposure = Math.pow(2, +e.target.value); pt.reset(); };
$('#lit').oninput = () => { if (D) { setLights(); pt.reset(); } };
$('#pause').onclick = e => { running = !running; e.target.textContent = running ? '일시정지' : '계속'; };
$('#save').onclick = () => { cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `GOFIT_실사렌더_${Math.floor(pt.samples)}샘플.png`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, 'image/png'); };
$('#load').onchange = e => { LOAD = +e.target.value; spf = 1; };
/* closing: stop, free the graphics card's memory and the context at once (not whenever the browser gets round to it) */
function shutdown() { running = false; try { fence && renderer.getContext().deleteSync(fence); fence = null; } catch (_) { } try { pt && pt.dispose(); } catch (_) { } try { scene && scene.traverse(o => { if (o.geometry) o.geometry.dispose(); const m = o.material; for (const q of Array.isArray(m) ? m : m ? [m] : []) { for (const k in q) if (q[k] && q[k].isTexture) q[k].dispose(); q.dispose(); } }); } catch (_) { } try { renderer && renderer.dispose(); renderer && renderer.forceContextLoss(); } catch (_) { } pt = null; }
window.ptShutdown = shutdown;
const leave = () => { shutdown(); post({ type: 'pt-close' }); };
$('#close').onclick = leave;
window.addEventListener('keydown', e => { if (e.key === 'Escape') leave(); });
window.addEventListener('pagehide', shutdown);
</script>
</body>
</html>
